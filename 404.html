<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Страница не найдена · Мягко°</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FFB27D'/%3E%3Cstop offset='1' stop-color='%23BBA9F4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='48' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;800&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F1EA; --ink:#241F2B; --ink-soft:#6E6678;
  --peach:#FFB27D; --peach-deep:#EF7E4C; --lav:#BBA9F4; --lav-deep:#7A5FE0;
  --font-d:'Unbounded',sans-serif; --font-b:'Golos Text',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#161120; --ink:#F3EFFA; --ink-soft:#A79CBB}
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--font-b); background:var(--bg); color:var(--ink);
  min-height:100vh; display:grid; place-items:center; padding:24px;
  text-align:center; overflow:hidden;
}
.scene{position:relative; max-width:480px; width:100%}
.blob{position:absolute; border-radius:50%; filter:blur(70px); z-index:0; pointer-events:none; animation:drift 18s ease-in-out infinite alternate}
.blob-1{width:320px;height:320px;top:-100px;left:-80px;background:radial-gradient(circle,rgba(255,178,125,.45),transparent 70%)}
.blob-2{width:280px;height:280px;bottom:-80px;right:-60px;background:radial-gradient(circle,rgba(187,169,244,.4),transparent 70%);animation-delay:-8s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(28px,20px) scale(1.1)}}
.num{
  font-family:var(--font-d); font-weight:800;
  font-size:clamp(6rem,22vw,12rem); line-height:1;
  background:linear-gradient(135deg,var(--peach),var(--lav));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  position:relative; z-index:1; margin-bottom:8px;
  animation:floaty 4s ease-in-out infinite;
}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
h1{font-family:var(--font-d); font-size:clamp(1.3rem,4vw,1.7rem); font-weight:700; margin-bottom:14px; position:relative; z-index:1}
p{color:var(--ink-soft); font-size:15.5px; line-height:1.6; margin-bottom:32px; max-width:380px; margin-inline:auto; position:relative; z-index:1}
.btn{
  display:inline-flex; align-items:center; gap:10px;
  background:var(--ink); color:var(--bg);
  font-family:var(--font-b); font-weight:600; font-size:15px;
  padding:15px 30px; border-radius:999px; text-decoration:none;
  position:relative; z-index:1;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease;
  box-shadow:0 1px 2px rgba(36,31,43,.04), 0 10px 30px rgba(36,31,43,.06);
}
.btn:hover{transform:translateY(-3px)}
.btn:active{transform:translateY(0) scale(.97)}
.btn .arrow{transition:transform .25s ease}
.btn:hover .arrow{transform:translateX(-4px)}
.chip{
  display:inline-flex; align-items:center; gap:8px;
  margin-top:28px; font-size:13px; color:var(--ink-soft);
  position:relative; z-index:1;
}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--peach);font-style:normal}
.breathe{
  display:inline-flex; align-items:center; gap:10px;
  margin-top:36px; font-size:12.5px; color:var(--ink-soft);
  position:relative; z-index:1;
}
.breathe-circle{
  width:18px;height:18px;border-radius:50%;
  background:radial-gradient(circle,var(--lav),var(--lav-deep));
  animation:breathe 8s ease-in-out infinite;
}
@keyframes breathe{0%,100%{transform:scale(.72);opacity:.75}40%,55%{transform:scale(1.15);opacity:1}}
</style>
</head>
<body>
<div class="scene">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="num">404</div>
  <h1>Такой страницы нет</h1>
  <p>Может, она переехала или её просто не было. Возвращайся домой — там спокойно и всё на своих местах.</p>
  <a href="/" class="btn"><span class="arrow">←</span> На главную</a>
  <div class="chip"><i></i>без красных уведомлений</div>
  <div class="breathe"><span class="breathe-circle"></span>выдохни и вернись</div>
</div>
</body>
</html>
